<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho de Compras</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Minha Loja Virtual!!!</h1>

    <div class="filtro">

        <label for="filtro">
            Filtrar produtos:
        </label>

        <select id="filtro">
            <option value="todos">
                Todos
            </option>
            <option value="ate50">
                Produtos até R$50
            </option>
            <option value="acima50">
                Produtos acima de R$50
            </option>
        </select>

    </div>

    <h2>Produtos</h2>

    <div id="lista-produtos"></div>

    <h2>Carrinho</h2>

    <div id="carrinho"></div>

    <h3 id="total">
        Total: R$ 0,00
    </h3>

    <script src="script.js"></script>

</body>
</html>
